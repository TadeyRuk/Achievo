name: Reconcile

on:
  schedule:
    # Hobby Vercel cannot host sub-daily crons; Actions triggers /api/reconcile instead.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  reconcile:
    name: Settle pending payouts
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        id: check
        env:
          ACHIEVO_BASE_URL: ${{ secrets.ACHIEVO_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${ACHIEVO_BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### :warning: Reconcile skipped — repo secrets not configured"
              echo "\`ACHIEVO_BASE_URL\` and/or \`CRON_SECRET\` are not set, so pending payouts are NOT being reconciled."
              echo "Add both in **Settings → Secrets and variables → Actions** to restore this job (see docs/OPS.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call /api/reconcile
        if: steps.check.outputs.configured == 'true'
        env:
          ACHIEVO_BASE_URL: ${{ secrets.ACHIEVO_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          base="${ACHIEVO_BASE_URL%/}"
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            "${base}/api/reconcile"
